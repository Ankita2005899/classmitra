<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard · ClassMitra</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f4;--card:#fff;--ink:#14212b;--muted:#5b6b78;--line:#d5dce2;--board:#1f4d4a;--deep:#163836;--chalk:#f2efe4;--mark:#e8a317;--alert:#c2412d;--ok:#2f7d4f;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3,.brand,.btn{font-family:"Bricolage Grotesque",sans-serif}
h2{margin:0 0 4px;font-size:1.2rem}p{margin:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--ink);text-decoration:none;margin-right:auto}
.top a.out{color:var(--board);font-weight:600}.hi{color:var(--muted)}
main{max-width:1320px;margin:0 auto;padding:24px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.col{display:grid;gap:20px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;animation:rise .45s both}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.slide{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.chip{flex:0 0 auto;scroll-snap-align:start;min-width:112px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;color:var(--ink);transition:.2s}
.chip b{display:block;font-family:"Bricolage Grotesque";font-size:1.15rem}.chip span{font-size:.8rem;color:var(--muted)}
.chip:hover{border-color:var(--board)}.chip.on{background:var(--board);border-color:var(--board);color:#fff}.chip.on span{color:#cfe0d9}
.lab{font-weight:600;font-size:.9rem;margin:8px 0 4px}
.body{animation:slide .35s both}
.now{border-radius:12px;padding:16px;color:#fff;background:var(--board)}.now.done{background:#4a5b55}.now.idle{background:#33505c}
.now b{font:700 1.15rem "Bricolage Grotesque"}.now small{display:block;color:#d6e6df}
.meter{height:7px;background:rgba(255,255,255,.25);border-radius:7px;margin:10px 0 8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--mark);transition:width 1s}
.msg{background:rgba(0,0,0,.2);border-radius:8px;padding:8px 12px;font-size:.9rem;margin-top:8px}
select,input[type=text],textarea{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);min-width:0}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--board)}
.sj{padding:12px 0;border-bottom:1px solid var(--line)}.sj:last-child{border:0}
.sjh{display:flex;justify-content:space-between;gap:8px;font-weight:600}.sjh em{font-style:normal;color:var(--ok)}
.tp{display:flex;gap:4px;margin-top:8px}.tp i{flex:1;height:14px;border-radius:4px;border:1.5px solid var(--line);background:#fff}.tp i.on{background:var(--ok);border-color:var(--ok)}
.sjf{font-size:.82rem;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.st{background:var(--paper);border-radius:10px;padding:10px 12px}.st b{display:block;font:800 1.4rem "Bricolage Grotesque"}.st span{font-size:.8rem;color:var(--muted)}.st.bad b{color:var(--alert)}
details{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}summary{cursor:pointer;font-weight:600}
.rolls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.rolls span{background:#fde8e4;color:var(--alert);border-radius:7px;padding:2px 9px;font-size:.85rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem}th{text-align:left;color:var(--muted);font-weight:500;padding:6px 4px}td{padding:7px 4px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--mark);color:#2a1d00;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.g{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn.sm{padding:5px 11px;font-size:13px}
.tg{border:0;border-radius:99px;padding:3px 12px;font:600 .8rem inherit;font-family:inherit;cursor:pointer}.tg.y{background:#e2f3ea;color:var(--ok)}.tg.n{background:#fde8e4;color:var(--alert)}
.drop{display:grid;place-items:center;text-align:center;padding:22px 12px;border:2px dashed var(--line);border-radius:12px;background:var(--paper);cursor:pointer;margin:10px 0}.drop:hover,.drop.over{border-color:var(--board);background:#e4efed}.drop span{color:var(--muted);font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.drop:focus-within{border-color:var(--board)}
.ttbox{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:380px}.ttbox img{display:block;width:100%}.ttbox embed{display:block;width:100%;height:380px}
.empty{padding:30px 12px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal .h{font-size:.78rem;color:var(--muted)}
.d{border:1.5px solid var(--line);border-radius:9px;padding:4px 0;font:inherit;background:#fff;cursor:pointer;min-height:48px;color:var(--ink)}.d small{display:block;font-size:1rem;line-height:1.1;font-weight:700}
.d.ok small{color:var(--ok)}.d.no small{color:var(--alert)}.d.part small{color:var(--mark)}.d.off{background:var(--paper);color:#9aa6af;cursor:default}.d.sel{border-color:var(--board);box-shadow:0 0 0 2px var(--mark)}.d.fut{color:#9aa6af}
.dd{margin-top:10px;font-size:.9rem;color:var(--muted)}.dd b{color:var(--ink)}
.fb{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .3s both}.fb:last-child{border:0}
.fb .m{font-weight:600}.fb small{color:var(--muted)}.pill{white-space:nowrap;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:#fff3d6;color:#7a5200}.pill.e{background:#fde8e4;color:var(--alert)}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ann{border-left:4px solid var(--mark);background:var(--paper);border-radius:8px;padding:9px 12px;margin-top:8px}.ann small{color:var(--muted)}
textarea{width:100%;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:9}.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:.95rem;color:var(--muted)}.crumb a{color:var(--board);font-weight:600;text-decoration:none}.crumb a:hover{text-decoration:underline}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);background:#fff;transition:.2s}
.opt:hover{border-color:var(--board);transform:translateX(4px)}.opt .bd{min-width:58px;text-align:center;background:var(--board);color:#fff;border-radius:9px;padding:8px 6px;font:800 .9rem "Bricolage Grotesque"}
.opt b{display:block;font-family:"Bricolage Grotesque"}.opt span{color:var(--muted);font-size:.86rem}.opt::after{content:"\203A";margin-left:auto;font-size:1.6rem;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:600 .9rem inherit;font-family:inherit;cursor:pointer}.tab.on{background:var(--board);border-color:var(--board);color:#fff}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}.scroll table td,.scroll table th{padding:7px 10px}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.add input{flex:1;min-width:120px}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.big{font:800 2rem "Bricolage Grotesque";color:var(--ok)}
.d small.c{font-size:.72rem;font-weight:500;color:var(--muted)}.d{min-height:56px}
.sc{font-size:.75rem;color:var(--muted)}</style>
</head>
<body>
<header class="top"><a class="brand" href="admin.html#/"><svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e8a317"/><path d="M26 13A10 10 0 1 0 26 27" fill="none" stroke="#1f4d4a" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="20" r="3.2" fill="#1f4d4a"/></svg>ClassMitra</a><span class="hi" id="hi">Admin dashboard</span><a class="out" href="login.html">Log out</a></header>
<main id="app"></main><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},P2=n=>String(n).padStart(2,'0');
const DEPT=[['COMP','Computer Engineering'],['IT','Information Technology'],['AIDS','AI and Data Science'],['ENTC','Electronics and Telecommunication'],['MECH','Mechanical Engineering'],['CIVIL','Civil Engineering'],['ELEC','Electrical Engineering']];
const YEAR=[['FE','First Year'],['SE','Second Year'],['TE','Third Year'],['BE','Fourth Year']],DIV=['A','B','C','D'],SUB=[1,2,3,4,5].map(n=>'Subject '+n),SLOT=[[9,10],[10,11],[11,12],[12,13],[14,15]];
let tab='students',sub=0,day=null,demo='',store={},q='';
try{const u=J('cm_user',null);if(u&&u.name)$('#hi').textContent='Hi, '+u.name.split(' ')[0]}catch(e){}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const rng=s=>{let a=0;for(const c of s)a=(a*31+c.charCodeAt(0))>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const path=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),scope=()=>path().join('-')||'ALL';
function D(){const k=scope();if(!store[k]){const r=rng(k);const rolls=[];while(rolls.length<6+Math.floor(r()*8)){const n=1+Math.floor(r()*60);if(!rolls.includes(n))rolls.push(n)}rolls.sort((a,b)=>a-b);
store[k]={students:Array.from({length:60},(_,i)=>({roll:i+1,name:'Student '+P2(i+1),att:Math.round(65+r()*33)})),notes:SUB.map((s,i)=>['Introduction notes of '+s]),act:SUB.map((s,i)=>['Practice activity 1 of '+s]),sb:SUB.map(s=>2+Math.floor(r()*9)),rolls}}return store[k]}
const now=()=>{const d=new Date();if(demo==='run')d.setHours(10,30,0,0);if(demo==='end')d.setHours(13,30,0,0);return d};
const taken=(d,i)=>{const n=now(),h=n.getHours()+n.getMinutes()/60;return d<n.getDate()?rng(scope()+d+i)()>.15:d===n.getDate()?h>=SLOT[i][1]:false},cnt=(d,i)=>44+Math.floor(rng(scope()+d+'p'+i)()*16);
function nowHtml(){const n=now(),h=n.getHours()+n.getMinutes()/60;if(n.getDay()===0&&!demo)return`<div class="now idle"><b>No lectures today</b><small>Sunday is a holiday.</small></div>`;
let i=SLOT.findIndex(s=>h>=s[0]&&h<s[1]);if(i>=0){const s=SLOT[i];return`<div class="now"><b>${SUB[i]} is going on</b><small>${P2(s[0])}:00 to ${P2(s[1])}:00 · ends in ${Math.round((s[1]-h)*60)} min · ${cnt(n.getDate(),i)} of 60 students present</small><div class="meter"><i style="width:${Math.round((h-s[0])*100)}%"></i></div><div class="msg">Message: ${SUB[i]} lecture started at ${P2(s[0])}:00 and will end at ${P2(s[1])}:00.</div></div>`}
let last=-1;SLOT.forEach((s,j)=>{if(h>=s[1])last=j});if(last<0)return`<div class="now idle"><b>No lecture right now</b><small>First lecture: ${SUB[0]} at 09:00</small></div>`;
return`<div class="now done"><b>${SUB[last]} lecture completed</b><small>Ended at ${P2(SLOT[last][1])}:00 · ${cnt(n.getDate(),last)} of 60 students were present</small><div class="msg">Message: ${SUB[last]} lecture is completed at ${P2(SLOT[last][1])}:00. ${SLOT[last+1]?'Next: '+SUB[last+1]+' at '+P2(SLOT[last+1][0])+':00.':'All lectures are done for today.'}</div></div>`}
function annHtml(){const s=scope(),a=J('cm_announcements',[]).filter(x=>!x.scope||x.scope==='ALL'||(s+'-').startsWith(x.scope+'-')).slice(0,4);
return`<section class="card"><h2>Announcements</h2><p class="sub">Posting for: <b>${s==='ALL'?'everyone':s.replace(/-/g,' / ')}</b>. Students see it on their dashboard.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><textarea id="at" rows="2" placeholder="Write an announcement" style="flex:1;min-width:200px"></textarea><button class="btn" id="post">Post</button></div><div id="an">${a.map(x=>`<div class="ann">${x.text}<br><small>${!x.scope||x.scope==='ALL'?'Everyone':x.scope.replace(/-/g,' / ')}</small></div>`).join('')}</div></section>`}
const ttCard=(t)=>`<section class="card"><h2>${t}</h2><p class="sub">Upload the timetable as an image.</p><label class="drop" id="drop"><input class="sr" id="file" type="file" accept="image/*"><b>Drop the timetable image here</b><span>or click to choose an image, up to 8 MB</span></label><div id="tt"></div></section>`;
async function tt(){const k='cm_timetable_'+(path().join('-')||'COLLEGE'),box=$('#tt'),t=J(k,null);if(!t||!t.type.startsWith('image/')){box.innerHTML='<div class="empty">No timetable uploaded yet.</div>';return}
box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>${t.name}</b><span><a class="btn g sm" href="${t.data}" target="_blank" rel="noopener" style="text-decoration:none">Open full size</a> <button class="btn g sm" id="rm">Remove</button></span></div><div class="ttbox"><img src="${t.data}" alt="Timetable"></div>`}
function save(f){if(!f)return;if(!f.type.startsWith('image/'))return toast('Please choose an image file.');if(f.size>8388608)return toast('Image is larger than 8 MB.');const r=new FileReader();r.onload=()=>{try{localStorage.setItem('cm_timetable_'+(path().join('-')||'COLLEGE'),JSON.stringify({name:f.name,type:f.type,data:r.result}));toast('Timetable saved')}catch(e){toast('Image is too big to keep in the browser.')}tt()};r.readAsDataURL(f)}
function calHtml(){const n=now(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let o=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
for(let d=1;d<=days;d++){if(new Date(y,m,d).getDay()===0){o+=`<div class="d off">${d}<small>-</small></div>`;continue}if(d>n.getDate()){o+=`<div class="d fut">${d}<small>&nbsp;</small></div>`;continue}
const t=SUB.map((_,i)=>taken(d,i)),c=t.filter(Boolean).length,av=c?Math.round(t.reduce((a,v,i)=>a+(v?cnt(d,i):0),0)/c):0;o+=`<button class="d ${c===5?'ok':c===0?'no':'part'} ${day===d?'sel':''}" data-d="${d}">${d}<small>${c===5?'&#10003;':c===0?'&#10007;':'&#189;'}</small><small class="c">${c?av+' present':'none'}</small></button>`}
let det='<p class="dd">Click a day to see each lecture and how many students were present.</p>';if(day)det=`<p class="dd"><b>${day} ${n.toLocaleString('en',{month:'long'})}</b><br>${SUB.map((s,i)=>taken(day,i)?`${s}: <b style="color:var(--ok)">completed &#10003;</b> · ${cnt(day,i)} of 60 present`:`${s}: <b style="color:var(--alert)">not taken &#10007;</b>`).join('<br>')}</p>`;
return`<section class="card"><h2>Lecture calendar</h2><p class="sub">${n.toLocaleString('en',{month:'long',year:'numeric'})}. A tick means all lectures were completed. The number is the average students present.</p><div class="cal">${o}</div>${det}</section>`}
function body(){const d=D();
if(tab==='students'){const r=d.students.filter(s=>(s.name+s.roll).toLowerCase().includes(q.toLowerCase()));return`<div class="add" style="margin:0 0 10px"><input type="text" id="sq" placeholder="Search by name or roll number" value="${q}"></div><div class="scroll"><table><tr><th>Roll</th><th>Name</th><th>Attendance</th><th></th></tr>${r.map(s=>`<tr><td>${P2(s.roll)}</td><td>${s.name}</td><td>${s.att}%</td><td><button class="btn g sm" data-rm="${s.roll}">Remove</button></td></tr>`).join('')||'<tr><td colspan="4">No student found.</td></tr>'}</table></div><p class="sub" style="margin-top:8px">${d.students.length} students in this division.</p><div class="add"><input type="text" id="sn" placeholder="New student name"><input type="text" id="sr" placeholder="Roll no" style="max-width:100px;flex:0 0 100px"><button class="btn" id="sa">Add student</button></div>`}
if(tab==='notes'||tab==='act'){const L=d[tab][sub],w=tab==='notes'?'note':'activity';return`<select id="ns" aria-label="Subject">${SUB.map((s,i)=>`<option value="${i}" ${i===sub?'selected':''}>${s}</option>`).join('')}</select><div style="margin-top:8px">${L.map(x=>`<div class="li"><span>${x}</span><span class="tg y">Provided</span></div>`).join('')||'<p class="sub">Nothing provided yet.</p>'}</div><div class="add"><input type="text" id="ni" placeholder="Title of the new ${w}"><button class="btn" data-add="${tab}">Add ${w}</button></div>`}
if(tab==='pres'){const n=now(),h=n.getHours()+n.getMinutes()/60;return`<p class="sub">Today's lectures and students present.</p>${SUB.map((s,i)=>{const st=h>=SLOT[i][1]?'done':h>=SLOT[i][0]?'live':'next',c=cnt(n.getDate(),i);return`<div class="sj"><div class="sjh"><span>${s} · ${P2(SLOT[i][0])}:00</span><em>${st==='next'?'Upcoming':st==='live'?'Going on · '+c+'/60':'Completed · '+c+'/60'}</em></div>${st==='next'?'':`<div class="meter" style="background:#e3e9e6"><i style="width:${Math.round(c*100/60)}%;background:var(--ok)"></i></div><div class="sjf">${60-c} absent</div>`}</div>`}).join('')}`}
if(tab==='prog'){const sy=Math.round(d.sb.reduce((a,x)=>a+x,0)*10/SUB.length);return`<p class="sub">${sy}% of the syllabus is complete.</p>${d.sb.map((x,i)=>`<div class="sj"><div class="sjh"><span>${SUB[i]}</span><em>${x*10}% complete</em></div><div class="tp">${Array.from({length:10},(_,j)=>`<i class="${j<x?'on':''}"></i>`).join('')}</div><div class="sjf">${x} of 10 topics covered</div></div>`).join('')}<div class="stats" style="margin-top:12px"><div class="st"><b>${60-d.rolls.length}</b><span>Submitted</span></div><div class="st bad"><b>${d.rolls.length}</b><span>Defaulters</span></div><div class="st"><b>${Math.round((60-d.rolls.length)*100/60)}%</b><span>Completion</span></div></div><details><summary>Defaulter students (Assignment 2)</summary><div class="rolls">${d.rolls.map(n=>`<span>Roll ${P2(n)}</span>`).join('')}</div><button class="btn sm" id="rem">Send reminder</button></details>`}
const f=J('cm_feedback',[]).slice().reverse();return`<p class="sub">Messages students send during a lecture.</p>${f.slice(0,8).map(x=>`<div class="fb"><div><div class="m">${x.msg}</div><small>${x.who||'Student'} · ${x.sub} · ${new Date(x.ts).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<div class="empty">No messages from students yet.</div>'}${f.length?'<button class="btn g sm" id="clr" style="margin-top:10px">Clear messages</button>':''}`}
function page(){const p=path(),L=p.length,dn=DEPT.find(x=>x[0]===p[0]),yn=YEAR.find(x=>x[0]===p[1]);
if(L&&!dn||L>1&&!yn||L>2&&!DIV.includes(p[2])){location.hash='#/';return}
const cr=[`<a href="#/">Home</a>`];if(dn)cr.push(`<a href="#/${p[0]}">${dn[1]}</a>`);if(yn)cr.push(`<a href="#/${p[0]}/${p[1]}">${yn[1]}</a>`);if(L>2)cr.push(`<b>Division ${p[2]}</b>`);
let html=`<div class="crumb">${cr.join(' &rsaquo; ')}</div>${annHtml()}<div class="layout" style="margin-top:20px">`;
if(L<3){const items=L===0?DEPT.map(d=>`<a class="opt" href="#/${d[0]}"><div class="bd">${d[0]}</div><div><b>${d[1]}</b><span>4 years · 960 students</span></div></a>`):L===1?YEAR.map(y=>`<a class="opt" href="#/${p[0]}/${y[0]}"><div class="bd">${y[0]}</div><div><b>${y[1]}</b><span>4 divisions · 240 students</span></div></a>`):DIV.map(v=>`<a class="opt" href="#/${p[0]}/${p[1]}/${v}"><div class="bd">${v}</div><div><b>Division ${v}</b><span>60 students</span></div></a>`);
html+=`<section class="card body"><h2>${L===0?'Departments':L===1?dn[1]:yn[1]+' divisions'}</h2><p class="sub">${L===0?'Pick a department.':L===1?'Pick a year.':'Pick a division.'}</p><div class="opts">${items.join('')}</div></section>${ttCard(L===0?'Complete timetable':L===1?dn[0]+' timetable':dn[0]+' '+yn[0]+' timetable')}</div>`}
else html+=`<div class="col">${ttCard('Timetable: '+p[0]+' '+p[1]+' '+p[2])}</div><div class="col"><section class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px"><h2>Now in ${p[1]} ${p[2]}</h2><select id="demo" aria-label="Demo time"><option value="">Real time</option><option value="run" ${demo==='run'?'selected':''}>Demo: lecture running</option><option value="end" ${demo==='end'?'selected':''}>Demo: lecture completed</option></select></div><div id="now">${nowHtml()}</div></section>
<section class="card"><h2>Manage ${p[0]} ${p[1]} ${p[2]}</h2><div class="tabs">${[['students','Students'],['notes','Notes'],['act','Activities'],['pres','Presentees'],['prog','Progress'],['msg','Messages']].map(t=>`<button class="tab ${t[0]===tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tb">${body()}</div></section><div id="cal">${calHtml()}</div></div></div>`;
$('#app').innerHTML=html;tt()}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
if(x=g('[data-tab]')){tab=x.dataset.tab;q='';$('#tb').innerHTML=body();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===x));return}
if(x=g('[data-d]')){day=+x.dataset.d;$('#cal').innerHTML=calHtml();return}
if(x=g('[data-rm]')){const d=D();d.students=d.students.filter(s=>s.roll!==+x.dataset.rm);$('#tb').innerHTML=body();return}
if(g('#sa')){const n=$('#sn').value.trim(),r=parseInt($('#sr').value,10);if(!n||!r)return toast('Enter the name and roll number.');const d=D();if(d.students.some(s=>s.roll===r))return toast('This roll number already exists.');d.students.push({roll:r,name:n,att:0});d.students.sort((a,b)=>a.roll-b.roll);$('#tb').innerHTML=body();toast('Student added');return}
if(x=g('[data-add]')){const t=$('#ni').value.trim();if(!t)return toast('Write the title first.');D()[x.dataset.add][sub].push(t);$('#tb').innerHTML=body();toast('Added');return}
if(g('#rem'))return toast('Reminder sent to '+D().rolls.length+' students (demo).');
if(g('#rm')){localStorage.removeItem('cm_timetable_'+(path().join('-')||'COLLEGE'));tt();return}
if(g('#clr')){localStorage.removeItem('cm_feedback');$('#tb').innerHTML=body();return}
if(g('#post')){const t=$('#at').value.trim();if(!t)return toast('Write the announcement first.');const a=J('cm_announcements',[]);a.unshift({text:t,scope:scope(),ts:Date.now()});localStorage.setItem('cm_announcements',JSON.stringify(a));const s=$('#app .card');page();toast('Announcement posted')}});
document.addEventListener('change',e=>{if(e.target.id==='demo'){demo=e.target.value;page()}if(e.target.id==='ns'){sub=+e.target.value;$('#tb').innerHTML=body()}if(e.target.id==='file'){save(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){q=e.target.value;const p=e.target.selectionStart;$('#tb').innerHTML=body();const i=$('#sq');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('over')}});document.addEventListener('dragleave',e=>{if(e.target.closest('#drop'))$('#drop').classList.remove('over')});
document.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.remove('over');save(e.dataTransfer.files[0])}});
window.addEventListener('storage',e=>{if(e.key==='cm_feedback'&&tab==='msg'&&$('#tb')){$('#tb').innerHTML=body();toast('New message from a student')}});
window.addEventListener('hashchange',()=>{day=null;q='';page()});
setInterval(()=>{if($('#now'))$('#now').innerHTML=nowHtml()},30000);
page();
</script>
</body>
</html>
